<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ogun">
  <!--
    An anvil, struck.

    Ogun is the orisha of iron and metalwork, patron of blacksmiths, so an anvil is the
    obvious mark — and it is one of the few shapes that survives being 16 pixels wide.
    Drawn for that size: one silhouette, no interior detail, and sparks off the horn
    placed above the face so they read as motion rather than as noise on the outline.

    The mark carries its own ground rather than adapting to the page. A plate that
    followed the theme would be dark in a dark tab and light in a light one, which means
    the icon is a different thing depending on where you look at it — and the sidebar,
    sitting on a known panel, would need a different treatment again. An orange field
    with a dark anvil is one drawing, legible on any background, and identical in the tab
    and in the menu.
  -->
  <rect width="32" height="32" rx="7" fill="#d98b3a" />

  <g fill="#17120b" opacity="0.55">
    <circle cx="7.5" cy="6.5" r="1.15" />
    <circle cx="11.5" cy="4.6" r="0.85" />
    <circle cx="4.6" cy="9.4" r="0.7" />
  </g>

  <!--
    Horn tapering left, the face, the waist, and a base that flares wider than the face
    so it sits rather than floats.
  -->
  <path
    fill="#17120b"
    d="M3.2 13.6
       C5.4 12.2 7.6 11.6 9.6 11.5
       L26.4 11.5
       A1.4 1.4 0 0 1 27.8 12.9
       L27.8 14.6
       A1.4 1.4 0 0 1 26.4 16
       L20.6 16
       C20.2 18.6 19.4 20.1 18.2 21.2
       L18.2 23.4
       L23.6 23.4
       A1.5 1.5 0 0 1 25.1 24.9
       L25.1 26.3
       A1.4 1.4 0 0 1 23.7 27.7
       L8.3 27.7
       A1.4 1.4 0 0 1 6.9 26.3
       L6.9 24.9
       A1.5 1.5 0 0 1 8.4 23.4
       L13.8 23.4
       L13.8 21.2
       C12.6 20.1 11.8 18.6 11.4 16
       L9.6 16
       C7.6 15.9 5.4 15.2 3.2 13.9
       Z"
  />
</svg>
