<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ogun">
  <!--
    An anvil, struck.

    Ogun is the orisha of iron, metalwork, and tools — the patron of blacksmiths — so an
    anvil is the obvious mark, and it is also one of the few shapes that survives being
    16 pixels wide. Everything here is built for that size: one silhouette, no interior
    detail, and a background plate so it holds up against both a light and a dark
    browser tab.

    Drawn rather than generated, because a favicon is mostly a test of whether the
    silhouette still reads once it is smaller than the text beside it.
  -->
  <rect width="32" height="32" rx="7" fill="#16181d" />

  <!--
    The strike: three sparks off the horn. Placed above the face so they read as motion
    at small sizes rather than as noise on the outline.
  -->
  <g fill="#d98b3a" opacity="0.9">
    <circle cx="7.5" cy="6.5" r="1.15" />
    <circle cx="11.5" cy="4.6" r="0.85" />
    <circle cx="4.6" cy="9.4" r="0.7" />
  </g>

  <!--
    The anvil. One path: horn tapering left, the face, the waist, and a base that flares
    wider than the face so it sits rather than floats.
  -->
  <path
    fill="#e8a24f"
    d="M3.2 13.6
       C5.4 12.2 7.6 11.6 9.6 11.5
       L26.4 11.5
       A1.4 1.4 0 0 1 27.8 12.9
       L27.8 14.6
       A1.4 1.4 0 0 1 26.4 16
       L20.6 16
       C20.2 18.6 19.4 20.1 18.2 21.2
       L18.2 23.4
       L23.6 23.4
       A1.5 1.5 0 0 1 25.1 24.9
       L25.1 26.3
       A1.4 1.4 0 0 1 23.7 27.7
       L8.3 27.7
       A1.4 1.4 0 0 1 6.9 26.3
       L6.9 24.9
       A1.5 1.5 0 0 1 8.4 23.4
       L13.8 23.4
       L13.8 21.2
       C12.6 20.1 11.8 18.6 11.4 16
       L9.6 16
       C7.6 15.9 5.4 15.2 3.2 13.9
       Z"
  />
</svg>
