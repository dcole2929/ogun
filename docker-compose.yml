services:
  postgres:
    image: postgres:17-alpine
    container_name: ogun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogun
      POSTGRES_PASSWORD: ogun
      POSTGRES_DB: ogun
    ports:
      # 5433 on purpose — 5432 is usually already taken by a project's own stack
      - "5433:5432"
    volumes:
      - ogun-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogun -d ogun"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ogun-pgdata:
