project:
  name: ogun
  defaultBranch: main

workers:
  adversarial-review:
    skill: adversarial-review
    runtime: claude
    model: worker
    permissions: reviewer
    sandbox: container
  security-review:
    skill: adversarial-review
    runtime: codex
    model: reviewer
    prompt: Use the adversarial-review skill. Focus on authorization boundaries,
      trust boundaries, and anything that handles credentials.
  triage:
    skill: triage
    runtime: claude
    model: reviewer
    permissions: reviewer
    sandbox: container

  # The first worker in this fleet allowed to write, and the thing the whole of phase 3
  # was built for: it takes one finding out of the inbox the reviewers and triage fill,
  # fixes it, and the host turns the patch into a draft pull request.
  #
  # **No `schedule:`, deliberately.** `ogun trigger ogun fix-a-finding` is the only way
  # this runs. Every other gate here is a bound on damage — the tests gate, the `ogun/`
  # branch prefix, `maxOpenPullRequests`, the draft — and not one of them is a substitute
  # for a person having watched one of these runs end to end. A schedule is the last thing
  # to add, after that has happened, and adding it is one line.
  fix-a-finding:
    skill: make-a-change
    # `claude`, and the difference that decides it is what happens inside the container.
    # Codex's own sandbox cannot run in ours (§10.2), so a codex job runs with
    # `--dangerously-bypass-approvals-and-sandbox` and the container is the only thing
    # between the agent and the host. Claude adds one legible layer on top: the runtime is
    # told which permission profile it is running under, and withholds the edit tools for
    # anything that is not a modifier. That layer is not what enforces the profile — the
    # mount is — but the first worker allowed to write is not where to spend a layer.
    # The reviewers already prove both runtimes work against this repo; a modifier is not
    # also the place to be testing the second one.
    runtime: claude
    # Not the default `worker`, which the router points at the cheaper model on the
    # grounds that the worker burns most of the tokens and most of the clock (§4.7). That
    # argument is about a nightly fleet, and this worker has no schedule: it runs once,
    # when somebody asks. The expensive mistake here is not a slow round, it is a patch
    # that looks right — and the hardest thing the skill asks for is declining, which is
    # judgement rather than throughput. If this later grows a schedule and the cost shows,
    # `worker` is the one-word change.
    model: reviewer
    permissions: modifier
    # `container`, and `policies.allowSandboxDowngrade: false` means it could not be
    # anything else — a modifier on `worktree` is an agent editing files directly in the
    # checkout on this machine. It also needs `ogun/project-ogun:latest` rather than
    # `ogun/base`, which is what runs postgres and this repo's own suite; admission
    # refuses a modifier for a project with no `.ogun/Dockerfile` for exactly that reason.
    sandbox: container
    # No `egress:`. Checked rather than assumed: the default allowlist for a claude
    # runtime is the model API plus `registry.npmjs.org`, and the registry is on it
    # *because* of this gate — `tests.command` starts with `pnpm install`, and a blocked
    # registry would fail as a red suite and be blamed on the patch. This repo resolves
    # every dependency from that one host: no `.npmrc`, no git or tarball dependencies,
    # pnpm baked into the project image rather than fetched by corepack at run time.
    # Adding hosts here is additive, so it is the right knob when a suite reaches further;
    # it just has nothing to add today.
    #
    # 45 minutes rather than the default 30. The gate's clock is whatever is left of this
    # number when the agent exits, not a budget of its own (verify.ts) — and a modifier
    # spends its round reading, editing *and* running the suite, then the runner runs the
    # suite again. A gate that starts with nothing left records that the suite never ran,
    # which refuses to publish for a reason that reads like a broken harness rather than
    # a bad patch.
    timeoutMs: 2700000

  # The entry node of a ticket pipeline: the one worker that decides whether a ticket is
  # work Ogun should attempt at all (§4.13, ADR-0013). It is the first worker here whose
  # product is a *decision* rather than a description, and everything below follows from
  # that.
  #
  # **No `schedule:`, and no source pointing at it in this repository** — see the
  # `sources:` note below for why this config has no such block. Here it runs by hand, and
  # the way to watch one of these read before wiring a real board to it is a manual trigger
  # carrying a pasted ticket as the prompt override:
  #
  #     curl -X POST $OGUN/api/trigger -H 'content-type: application/json' \
  #       -d '{"project":"ogun","worker":"scope-a-ticket","prompt":"Use the scope-a-ticket
  #            skill.\n\n<the ticket text>"}'
  #
  # A manual override *replaces* the prompt rather than appending to it (§5.1), which is why
  # the skill sentence has to be in there too — a source appends, a person does not.
  scope-a-ticket:
    skill: scope-a-ticket
    runtime: claude
    # Not the default `worker`. That default is an argument about a nightly fleet — the
    # worker burns the tokens and the clock, so point it at the cheaper model (§4.7) — and
    # it does not survive contact with this one. This worker spends almost nothing: a
    # search, three files, one paragraph. What it decides is whether a whole pipeline runs,
    # and a wrong decline is *permanent*, because Ogun writes nothing back to the tracker
    # and the emission ledger never re-emits a ticket. The cheap mistake here costs a
    # ticket that nobody ever notices was dropped.
    model: reviewer
    # `observer` — reads the code and nothing else — and this is the first worker in the
    # fleet that is honestly one. `reviewer` is the label that says "emits findings", and
    # the whole discipline of this skill is that it emits none: it is judging a ticket, not
    # the code, and it has none of a reviewer's evidence behind it. `modifier` is out for
    # the reason that matters most: an evaluator that can write is one that can start doing
    # the work it was asked to judge, and the temptation to do exactly that is strongest at
    # the moment it decides the work is doable. The read-only mount is what makes "do not
    # do the work" a fact rather than an instruction.
    permissions: observer
    sandbox: container
    # **No `connections: [linear]`, deliberately**, and this is the decision in here most
    # likely to be revisited. The tempting argument is that a thin ticket often has its
    # real content in the comments, so let the evaluator go and read them. That inverts the
    # skill: "this ticket is underspecified" is the most useful thing it can ever say, and
    # an evaluator that goes looking for the missing half turns it into "this ticket plus
    # forty comments might be specified" — after which the pipeline downstream is handed a
    # brief that does not contain what the decision was based on. It is also the wrong
    # worker to hand a credential to. `connections:` grants arbitrary reads across the
    # whole workspace the project's grant covers (§4.13), and this worker's prompt contains
    # untrusted text written by whoever filed the ticket.
    #
    # 10 minutes rather than the default 30, and the cap is a *bound on a failure mode*
    # rather than a performance target. The way this skill goes wrong is enthusiasm — the
    # agent is already in the repository, works out the fix because that is more satisfying
    # than deciding whether anybody should, and then admits whatever it managed to design.
    # Reading three files and writing a paragraph does not need half an hour; designing a
    # change does.
    timeoutMs: 600000
    # What turns a missing verdict into a failed gate instead of a silent `approved`
    # (§4.10). Declared here rather than defaulted anywhere, because only this stanza knows
    # that this worker's whole product is an answer: a reviewer that carries no verdict is
    # an ordinary reviewer, and this one is broken. Without it, an evaluator that hits its
    # timeout mid-thought releases its dependents, and the plan and implement stages run on
    # a ticket nobody judged — fail-open at exactly the gate whose job is to be closed.
    verify:
      expectations:
        - name: verdict
          method: tool

  # The planning half of phase 4's pipeline (§9, ADR-0015). A reviewer, not a modifier: it
  # produces no patch, so the edit tools are withheld and the workspace is mounted
  # read-only — and the plan it writes is staged for the node after it rather than
  # published to the inbox, because it has a dependent (§4.12).
  #
  # `model: reviewer` for the same reason `fix-a-finding` uses it: the expensive mistake
  # here is not a slow round, it is a plan that looks right. A wrong plan costs the whole
  # of the next node's container as well as this one's.
  #
  # **No `connections: [linear]`.** The door ADR-0013's amendment opened stays shut: the
  # grant cannot be narrower than the whole workspace, and this node's output is piped
  # into the instructions of the node that writes code. If it is ever opened it goes here
  # and only here, which is one reason this is a separate worker from `implement`.
  plan-a-ticket:
    skill: plan-a-ticket
    runtime: claude
    model: reviewer
    permissions: reviewer
    sandbox: container
    # The same lens `scope-a-ticket` declares, for the same reason one stage later
    # (§4.10, ADR-0015). A planner that finds nothing to build answers `verdict:
    # decline` and stops the cycle there; one that hits its timeout mid-thought would
    # otherwise report `approved` with no plan and release a modifier at nothing. A
    # missing answer is a failed gate, not a quiet yes.
    verify:
      expectations:
        - name: verdict
          method: tool

  # The building half. The same skill as `fix-a-finding` above, bound differently — §4.8's
  # skill-vs-worker distinction doing actual work: one procedure, two sources of work.
  implement:
    skill: make-a-change
    runtime: claude
    model: reviewer
    permissions: modifier
    sandbox: container
    # `review`, and it is the only agent lens this build wires (ADR-0015). It reads the
    # diff — one change or four, a test weakened to make the suite green, a message that
    # explains the repair — refuses the patch on a `critical` or `high`, and the refusal
    # buys the agent one more round with the reviewer's words verbatim. Asked for here
    # rather than defaulted, because a rubric with nothing to calibrate against should
    # cost one worker rather than every modifier (§4.10).
    verify:
      expectations:
        - name: review
          method: agent
    # 60 minutes rather than `fix-a-finding`'s 45, and the extra quarter of an hour is the
    # review. The gate's clock is what remains of this number when the agent exits
    # (verify.ts), and the gate now runs the suite *and* a model round. A retry holds back
    # both measurements, so a timeout that cannot cover them refuses with the numbers in
    # the sentence — legible, and still a run that produced no pull request.
    timeoutMs: 3600000

cycles:
  # The reviewers run in parallel and stage what they find; triage is the only thing
  # that writes to the inbox. Listing a worker under `then:` is what makes its inputs
  # stage-only — no flag on the worker itself, so the same reviewer can run standalone
  # in another cycle and publish directly.
  nightly:
    workers: [adversarial-review, security-review]
    then: triage
    # The schedule belongs to the cycle, not to the reviewers. A reviewer that kept its
    # own would run a second time outside the cycle and publish its findings raw.
    schedule: "0 3 * * *"
    onMissed: skip
    # `degrade` — if a reviewer errors, triage still runs and reports the night as
    # incomplete. `block` would mean one crashed reviewer buries the other's findings.
    onDepFailure: degrade

# ---------------------------------------------------------------------------------------
# `sources:` — deliberately absent, and the absence is the honest answer rather than a gap.
#
# A source is per project: it names a team on a board and a cycle in *this* config, and
# every ticket it admits becomes a job against *this* repository (§4.13, ADR-0013). The one
# workspace this machine can currently reach belongs to a different codebase, so a source
# here would poll another project's tickets and open pull requests against Ogun about work
# that has nothing to do with it. `enabled: false` would be no better: it is the same
# incoherent statement, switched off, waiting for somebody to switch it on because it looks
# like it was meant to be running.
#
# What a real operator writes, in the repository the tickets are actually about:
#
#     sources:
#       tickets:
#         kind: linear
#         cycle: scope-a-ticket   # or a named cycle — see below
#         team: ENG
#         pollMinutes: 5
#         maxPerPoll: 3
#         filter:
#           status: [Todo]
#           labels: [ogun]        # all of them, not any
#           excludeLabels: [needs-design]
#           notBlocked: true
#
# plus `ogun secret set <project> linear` or `ogun connect linear <project>` for the
# credential, which lives on the host and never reaches a container.
#
# **`cycle:` may name a worker.** Every worker is a one-node cycle (§5.1, ADR-0007), so
# pointing a source straight at `scope-a-ticket` is the smallest thing that works and needs
# no `cycles:` block at all: the ticket is judged, and admitted tickets go no further
# because there is nowhere further to go. That is a real configuration and not a
# placeholder — a board where a person wants Ogun's opinion on what is worth attempting,
# and nothing else.
#
# **The pipeline attaches without redesign.** `ogun project sync` refuses a source whose
# cycle does not have exactly one entry node, because a ticket has to arrive somewhere and
# picking the first node in array order would be right most nights and wrong invisibly. The
# sugar form already produces exactly one:
#
#     cycles:
#       ticket-pipeline:
#         workers: [scope-a-ticket]
#         then: plan
#         onDepFailure: block      # not optional here — see below
#
# and the general nodes/edges form takes it further along a chain. Either way the entry node
# stays this one, which is the property everything downstream depends on: the ticket is
# judged before anything is attempted.
#
# **Write `onDepFailure: block`, and know why.** The sugar defaults to `degrade`, which is
# right for the fan-in it was written for — triage running over three of four reviewers
# beats a night that produces nothing. On a *chain* it means something else entirely: "run
# the planner even though the thing in front of it did not succeed". A declined ticket is
# safe either way, because a decline is not a failure and `releaseDependents` blocks on one
# whatever the edge says. An evaluator that *crashed* is not, and on a `degrade` edge the
# pipeline would go on to plan and implement a ticket nobody ever judged — which is the
# whole thing this node exists to prevent, defeated by a default nobody looked at.
#
# The default is left as it is rather than made to depend on the shape of the graph: it is
# the pipeline's decision surface, and one word in the file that says what you meant beats
# a default that changes meaning when you add a second worker.
# ---------------------------------------------------------------------------------------

# How a modifier's patch is proved before it can be published (§9). Read from the blob at
# the pinned base rather than from the workspace — a modifier can write to its checkout,
# and an agent that edits this line to `true` would be setting its own gate.
#
# `install` first because the workspace is a clone with no node_modules; the pnpm store
# lives in the cache volume the runner mounts, so only the first run pays for it.
  # Phase 4's pipeline: ticket → plan → implement → draft PR (§9, ADR-0015). A source names
  # this cycle; there is deliberately no `schedule:`, because what starts it is a ticket.
  #
  # Written as `nodes`/`edges` rather than with `workers:`/`then:` sugar, because the sugar
  # expresses a fan-in — several workers into one — and this is a chain. Three nodes, two
  # edges, and `scope` is the single entry node a source requires (ADR-0013).
  #
  # **`block` on both edges, where `nightly` uses `degrade`.** The rule that separates them
  # is what the dependent's job *is*. Triage reports on a batch, so a partial batch is a
  # partial report and running it is better than losing the night. A planner acts on a
  # verdict and a modifier acts on a plan: each node here is the sole input to the next, so
  # there is nothing to degrade to. `degrade` on the first edge plans a ticket nobody
  # admitted; on the second it writes code with no confirmed plan.
  #
  # `block` is therefore about a node that *crashed*, and only that. A node that **declined**
  # — the evaluator refusing a ticket, or the planner finding nothing to build — is blocked
  # on whatever the edge says, because `releaseDependents` reads the verdict rather than the
  # edge: a decline is not a break, and "carry on without them" and "carry on against them"
  # are different permissions. Both nodes declare the `verdict` lens, so a node that answers
  # nothing fails its gate rather than releasing the rest of the chain.
  ticket:
    nodes:
      - key: scope
        worker: scope-a-ticket
      - key: plan
        worker: plan-a-ticket
      - key: implement
        worker: implement
    edges:
      - from: scope
        to: plan
        onDepFailure: block
      - from: plan
        to: implement
        onDepFailure: block

tests:
  command: pnpm install --frozen-lockfile && pnpm -s test

# One block, two readers, and the difference matters (§4.9).
policies:
  # --- Read by the runner from the git blob at the pinned base, never from the workspace
  # and never from the database. These decide what an agent's own work may become, and a
  # modifier can write to its checkout — a gate the agent can edit is not a gate.
  directPush: false
  allowSandboxDowngrade: false
  # The publisher's cap on *unreviewed* work, counted live against open pull requests
  # under the `ogun/` branch prefix — merging or closing one makes room immediately.
  # Written out rather than left to the default because it is the number you reach for
  # when the drafts start piling up, and a key you cannot see is a key you do not edit.
  maxOpenPullRequests: 3

  # --- Stored on the project row by `ogun project sync` and read by the foreman. These
  # are scheduling decisions taken before a sandbox exists, so the agent cannot reach
  # them and the runner has no business re-deriving them from a file.
  #
  # How many modifier jobs of this project's may be in flight at once. Zero switches
  # modifiers off entirely and is refused at admission with a sentence, not left queued.
  maxConcurrentModifiers: 1
  # Consecutive failures before a worker's breaker latches open (§4.3).
  failureBreakerThreshold: 3
